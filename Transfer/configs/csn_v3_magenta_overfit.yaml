# CSN-V3 overfit — magenta target region (255,0,255) input
model:
  name: CarpetShadeNetV3
  local_size: 512
  context_size: 1024
  global_long_side: 1024
  decoder_dim: 256
  dino:
    repo_root: "E:/Dino/dinov3"
    checkpoint: "E:/Dino/dinov3/dinov3_carpet_probe/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
    architecture: "dinov3_vitl16"
    patch_size: 16
    embed_dim: 1024
    intermediate_layers: [-4, -3, -2, -1]
    frozen: true
    strict_load: true
    cache_dir: "E:/Shadowing/Dataset_V3/global_tokens_csn_v3_magenta"
  convnext:
    architecture: "convnextv2_base"
    model_name: "convnextv2_base.fcmae_ft_in22k_in1k"
    pretrained: true
  structural_stem:
    channels: [32, 64, 96]
  fusion:
    dim: 256
    cross_attention_heads: 4
    cross_attention_blocks: 1
  decoder:
    channels: [256, 256, 192, 128, 96, 64]

data:
  dataset_root: "E:/Shadowing/Dataset_V3"
  train_crops: "manifests/train_crops_magenta.jsonl"
  eval_full_images: "manifests/eval_full_images.jsonl"
  input_mode: "magenta"
  magenta_guide_dir: "E:/Shadowing/converted_ready"
  crop_size: 512
  context_size: 1024
  center_halo: 64
  augment_dihedral: true
  boundary_dilate: 2

loss:
  final_ce: 1.00
  final_dice: 0.30
  where: 0.50
  level_ce: 0.50
  ordinal: 0.20
  transition: 0.50
  affinity: 0.30
  transition_boundary_dice: 0.40
  overlap_consistency: 0.10
  use_soft_ordinal_emd: true
  boundary_boost:
    enabled: true
    transition_dilate: 2
    where_boost: 2.0
    transition_boost: 3.0
    affinity_boost: 2.0
    level_ce_boost: 1.5

optimizer:
  lr_new_modules: 3.0e-4
  lr_convnext_stage34: 2.0e-5
  lr_convnext_stage12: 0.0
  weight_decay: 0.01
  grad_clip: 1.0

train:
  micro_batch: 1
  grad_accum: 4
  amp: auto_bf16_else_fp16
  total_micro_steps: 12000
  optimizer_steps: 3000
  warmup_ratio: 0.02
  min_lr: 1.0e-6
  phase: 6
  teacher_forcing: 0.0
  checkpoint_every_steps: 200
  eval_every_steps: 400
  full_image_eval_every_steps: 1000
  plot_every_steps: 100
  train_eval_max_batches: 8
  train_eval_max_samples: 16
  rotated_eval_k: [1, 2, 3]
  mode: overfit

inference:
  tile_size: 512
  halo: 64
  stride: 384
  global_long_side: 1024

renderer:
  class_to_gray: {0: 255, 1: 200, 2: 150, 3: 100}
  hard_black_lock: true
  output_format: bmp
