# CSN-V4 indexed_guided baseline — Masked CE + Masked Dice only
# Schema: indexed_guided.v1  (indices ≠ display gray/RGB)

model:
  name: CarpetShadeNetV4
  local_size: 512
  context_size: 1024
  global_long_side: 1024
  decoder_dim: 256
  dino:
    repo_root: "E:/Shadowing"
    checkpoint: "E:/Shadowing/weight/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
    architecture: "dinov3_vitl16"
    patch_size: 16
    embed_dim: 1024
    intermediate_layers: [-4, -3, -2, -1]
    frozen: true
    strict_load: true
    cache_dir: "E:/Shadowing/Dataset_V4/global_tokens_csn_v4_indexed"
  convnext:
    architecture: "convnextv2_base"
    model_name: "convnextv2_base.fcmae_ft_in22k_in1k"
    pretrained: true
  structural_stem:
    channels: [32, 64, 96]
  fusion:
    dim: 256
    cross_attention_heads: 4
    cross_attention_blocks: 1
  decoder:
    channels: [256, 256, 192, 128, 96, 64]

data:
  dataset_root: "E:/Shadowing/Dataset_V4"
  train_tiles: "manifests/train_capacity_tiles_bw.jsonl"
  scenes: "manifests/scenes.jsonl"
  eval_full_images: "manifests/eval_full_images.jsonl"
  input_mode: "indexed_guided"
  indexed_schema: "indexed_guided.v1"
  gray_adapter: "gray_legacy.v1"
  halo: 64
  core_size: 384
  crop_size: 512
  halo_loss_weight: 1.0
  supervision_mode: "generalization"
  deterministic_d4: true
  materialized_root: "materialized"
  prefer_materialized: true
  dataloader_workers: 0
  boundary_dilate: 2

loss:
  final_ce: 1.00
  final_dice: 0.30
  # Auxiliary heads OFF for baseline (enable only after ablation)
  where: 0.0
  level_ce: 0.0
  transition: 0.0
  affinity: 0.0
  transition_boundary_dice: 0.0
  base_refined_consistency: 0.0
  enable_where: false
  enable_transition: false
  enable_affinity: false
  enable_level: false
  enable_base_refined_consistency: false
  use_ordinal_head: false
  ordinal: 0.0
  boundary_boost:
    enabled: false
    transition_dilate: 2
    where_boost: 1.0
    transition_boost: 1.0
    affinity_boost: 1.0
    level_ce_boost: 1.0

optimizer:
  lr_new_modules: 3.0e-4
  lr_convnext_stage34: 2.0e-5
  lr_convnext_stage12: 1.0e-5
  weight_decay: 0.01
  grad_clip: 1.0

train:
  micro_batch: 1
  optimizer_steps: 5000
  grad_accum: 4
  amp: auto_bf16_else_fp16
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  phase: 6
  teacher_forcing: 0.0
  checkpoint_every_steps: 100
  eval_every_steps: 100
  full_image_eval_every_steps: 200
  plot_every_steps: 50
  eval_all_tiles: false
  eval_max_tiles: 100
  initial_eval_max_tiles: 16
  eval_max_holdout_scenes: 3
  eval_holdout_max_orientations: 2
  skip_initial_eval: true
  eval_all_orientations: true
  score_on_train: false
  pred_viz_every_steps: 10
  pred_viz_max_scenes: 2
  mode: generalization

inference:
  tile_size: 512
  halo: 64
  stride: 384
  global_long_side: 1024

renderer:
  class_to_gray: {0: 255, 1: 0, 2: 200, 3: 150, 4: 100}
  hard_black_lock: true
  output_format: bmp
