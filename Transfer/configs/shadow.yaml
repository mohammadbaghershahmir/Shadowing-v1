data:
  metadata_dir: "E:/Shadowing/dataset_metadata"
  train_crops: "train_crops.jsonl"
  val_crops: "val_crops.jsonl"
  crop_size: 512
  valid_center: 384
  ignore_index: -100
  max_crops_per_source_in_batch: 2
  augment_dihedral: false
local_encoder:
  family: convnextv2
  model_name: convnextv2_base.fcmae_ft_in22k_in1k
  pretrained: true
  trainable: true
  out_indices: [0, 1, 2, 3]
  layerwise_lr_decay: 0.875
global_encoder:
  family: dino
  model_name: vitl16_lvd
  frozen: true
  patch_size: 16
  use_spatial_patch_tokens: true
  cache_features: true
  repo_dir: "E:/Dino/dinov3"
  checkpoint: "E:/Dino/dinov3/dinov3_carpet_probe/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
  hub_entry: dinov3_vitl16
  input_size: 512
  feature_layer: 23
  token_dim: 1024
  cache_dir: "E:/Shadowing/dataset_metadata/global_tokens"
  cache_dtype: float16
model:
  decoder_dim: 256
  stem_channels: [32, 64, 96]
  refine_channels: 64
  cross_attn_blocks: 1
  cross_attn_heads: 4
  gate_init: 0.0
  norm: groupnorm32
  num_classes: 3
loss:
  ce: {weight: 1.00, class_weights: [0.875, 0.892, 1.233]}
  dice: {weight: 0.30}
  transition: {weight: 0.25, neighbors: 4, dilate: 1, pos_weight_clip: 10}
  affinity: {weight: 0.15, offsets: [1, 2, 4, 8], max_pairs: 4096}
  aux: {weight: 0.20}
train:
  micro_batch: 2
  grad_accum: 4
  amp: fp16
  optimizer: adamw
  lr_new: 2.5e-4
  lr_backbone: 3.0e-5
  weight_decay: 0.05
  no_decay: [bias, norm]
  warmup_ratio: 0.05
  schedule: cosine
  min_lr: 1.0e-6
  grad_clip: 1.0
  total_steps: 6500
  val_every_steps: 260
  full_image_val_every_steps: 1300
  early_stop_patience: 15
  seed: 42
eval:
  tile: 512
  halo: 64
  stride: 384
  score: {miou: 0.55, bf1_2px: 0.30, small_comp_f1: 0.15}
